name: ogp-tool

on:
  push:
    branches: [main]
    paths:
      - 'cmd/ogp/**'
      - 'assets/ogp/**'
      - '.github/workflows/ogp-tool.yml'
  pull_request:
    paths:
      - 'cmd/ogp/**'
      - 'assets/ogp/**'
      - '.github/workflows/ogp-tool.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cmd/ogp

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/ogp/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
