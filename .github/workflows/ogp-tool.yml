name: ogp-tool

on:
  push:
    branches: [main]
    paths:
      - 'cmd/ogp/**'
      - 'assets/ogp/**'
      - '.github/workflows/ogp-tool.yml'
  # Validate every PR, including shared action and dependency updates.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cmd/ogp

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/ogp/go.mod
          cache-dependency-path: cmd/ogp/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
