name: ogp-tool

on:
  push:
    branches: [main]
    paths:
      - 'cmd/ogp/**'
      - 'assets/ogp/**'
      - '.github/workflows/ogp-tool.yml'
  pull_request:
    paths:
      - 'cmd/ogp/**'
      - 'assets/ogp/**'
      - '.github/workflows/ogp-tool.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cmd/ogp

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/ogp/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
