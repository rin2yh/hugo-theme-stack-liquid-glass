# tagpr keeps an open release PR up to date on every push to main, and cuts a
# git tag + GitHub Release when that PR is merged. See docs/releasing.md.
#
# Runs with the default GITHUB_TOKEN rather than a GitHub App token: no workflow
# in this repo triggers on tags or releases, and the release PR touches only
# CHANGELOG.md (no path filters match), so downstream CI does not need to fire
# on it. The default token also stops the tagpr release PR (whose title is not
# Conventional Commits) from tripping the pr-title-lint gate.

name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — tagpr needs full history (changelog) and all tags
      # (version detection). persist-credentials: false — tagpr authenticates
      # git and the API itself via GITHUB_TOKEN.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # One-time bootstrap. tagpr derives the next version from the latest
      # vX.Y.Z tag, but this repo's earlier release-please tags use a
      # `hugo-theme-stack-liquid-glass-v*` prefix that tagpr ignores. The first
      # time this workflow runs (no vX.Y.Z tag yet) we seed v0.5.0 on the 0.5.0
      # release commit, so tagpr continues from 0.5.x and the first changelog
      # spans only new commits. This becomes a no-op once any vX.Y.Z tag exists
      # and is safe to delete after the first tagpr release.
      - name: Seed the initial vX.Y.Z tag (one-time)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git tag -l | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "A vX.Y.Z tag already exists; nothing to seed."
            exit 0
          fi
          seed_commit=3074d6677d6f309a2ebeac5fdd52fc2dd1a8c884
          echo "No vX.Y.Z tag found; seeding v0.5.0 at ${seed_commit}."
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/tags/v0.5.0\",\"sha\":\"${seed_commit}\"}"
          # Make the seeded tag visible to tagpr within this same run.
          git tag v0.5.0 "${seed_commit}"

      - uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
