name: example-site

on:
  push:
    branches: [main]
    paths:
      - 'archetypes/**'
      - 'assets/**'
      - 'i18n/**'
      - 'images/**'
      - 'layouts/**'
      - 'exampleSite/**'
      - 'theme.toml'
      - '.github/workflows/example-site.yml'
  pull_request:
    paths:
      - 'archetypes/**'
      - 'assets/**'
      - 'i18n/**'
      - 'images/**'
      - 'layouts/**'
      - 'exampleSite/**'
      - 'theme.toml'
      - '.github/workflows/example-site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: exampleSite

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.146.0'
          extended: true

      - run: hugo --gc --minify
