name: example-site

on:
  push:
    branches: [main]
    paths:
      - 'archetypes/**'
      - 'assets/**'
      - 'i18n/**'
      - 'images/**'
      - 'layouts/**'
      - 'exampleSite/**'
      - 'theme.toml'
      - '.github/workflows/example-site.yml'
  pull_request:
    paths:
      - 'archetypes/**'
      - 'assets/**'
      - 'i18n/**'
      - 'images/**'
      - 'layouts/**'
      - 'exampleSite/**'
      - 'theme.toml'
      - '.github/workflows/example-site.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: exampleSite

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.146.0'
          extended: true

      - run: hugo --gc --minify

      - name: Assert OGP images
        run: |
          set -euo pipefail
          # A post without a cover gets a Hugo-generated title image, and the
          # generated file is emitted under /ogp/.
          grep -q 'ogp/base_hu_' public/post/welcome/index.html
          ls public/ogp/base_hu_*.png >/dev/null
          # A post with an explicit cover keeps it; no generated image is used
          # (the generated-image step must stay below cover.image in priority).
          grep -q 'cover.svg' public/post/svg-cover/index.html
          ! grep -q 'base_hu_' public/post/svg-cover/index.html
