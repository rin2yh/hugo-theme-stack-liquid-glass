name: pr-title-lint

# Squash-merge uses the PR title as the commit subject, which lands in the
# generated CHANGELOG.md and the git history — so the title must follow
# Conventional Commits to keep the changelog readable. This gate enforces that.
# (Version bumps are chosen via labels on the tagpr release PR, not parsed from
# these titles — see docs/releasing.md.)
#
# Use `pull_request` (not `pull_request_target`): this job only reads the PR
# title from the event payload and never checks out PR code, so it does not
# need the base-repo context and secrets that `pull_request_target` grants to
# code from forks — running that against untrusted PRs is a known privilege-
# escalation footgun.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commit types kept for changelog/history readability.
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            ci
            build
            chore
            test
            style
