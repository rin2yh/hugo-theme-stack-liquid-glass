baseURL = "/"
title = "Stack Liquid Glass — Docs"
theme = "stack-liquid-glass"
defaultContentLanguage = "en"
hasCJKLanguage = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks]
docs = "/:filename/"

[markup.goldmark.renderer]
unsafe = true
[markup.tableOfContents]
ordered = true
startLevel = 2
endLevel = 4
[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
tabWidth = 2

[params]
mainSections = ["docs"]
description = "Usage documentation for the Stack Liquid Glass Hugo theme."
[params.dateFormat]
published = "2006/01/02"
lastUpdated = "2006/01/02 15:04 MST"
[[params.widgets.homepage]]
type = "search"
[[params.widgets.homepage]]
type = "archives"
[params.widgets.homepage.params]
limit = 10
[[params.widgets.page]]
type = "toc"

