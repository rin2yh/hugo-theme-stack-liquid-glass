baseURL = "/"
languageCode = "en"
title = "Stack Liquid Glass — Demo"
theme = "stack-liquid-glass"
hasCJKLanguage = true
defaultContentLanguage = "en"

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks]
post = "/post/:contentbasename/"

[markup.goldmark.renderer]
unsafe = true
[markup.tableOfContents]
ordered = true
startLevel = 2
endLevel = 4
[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = false
tabWidth = 2

[params]
mainSections = ["post"]
rssFullContent = true
# Mobile header back button — shown to the left of the site name on every page
# except the home page. On by default; set to false to hide it.
# mobileBackButton = false
# Icon for the share action (sidebar widget + mobile FAB). Name an SVG you
# place in your own assets/icons/ dir; unset falls back to a generic
# external-link icon. The theme ships no brand-logo asset (trademarks).
# shareIcon = "your-icon"
description = "Demo site for the Stack Liquid Glass Hugo theme."
# Fonts: the theme ships no webfonts. This demo loads its typography from the
# site side in layouts/partials/head/custom.html — the pattern any site uses to
# bring its own fonts. To restyle without touching CSS, override the font
# variables here, e.g.:
#   [params.fonts]
#   display = "'Playfair Display', serif"
#   body    = "'Inter', 'Noto Sans JP', sans-serif"
[params.ogp]
# Draw the site name in the bottom-left of generated OGP images. `true` uses
# the site title; a string draws a custom label. Unset = brand-neutral image.
siteName = true
# Only brand pages dated on/after this, so enabling it on an existing blog does
# NOT regenerate older images (they stay byte-identical). Set it to the day you
# turn branding on. Unset here so the demo brands every post.
# siteNameSince = "2026-07-14"
[params.dateFormat]
published = "2006/01/02"
lastUpdated = "2006/01/02 15:04 MST"
[params.footer]
since = 2026
customText = ""
[params.sidebar.avatar]
enabled = false
local = false
src = ""
[[params.widgets.homepage]]
type = "search"
[[params.widgets.homepage]]
type = "archives"
[[params.widgets.homepage]]
type = "categories"
[params.widgets.homepage.params]
limit = 10
[[params.widgets.homepage]]
type = "tag-cloud"
[params.widgets.homepage.params]
limit = 10
[[params.widgets.page]]
type = "toc"
[[params.widgets.page]]
type = "twitter-share"

[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = 1
[menu.main.params]
icon = "home"

[[menu.main]]
identifier = "about"
name = "About"
url = "/page/about/"
weight = 2
[menu.main.params]
icon = "user"

[[menu.main]]
identifier = "archives"
name = "Archives"
url = "/page/archives/"
weight = 3
[menu.main.params]
icon = "archives"

[[menu.main]]
identifier = "search"
name = "Search"
url = "/page/search/"
weight = 4
[menu.main.params]
icon = "search"

[[social]]
identifier = "rss"
name = "RSS"
url = "/index.xml"
weight = 1
[social.params]
icon = "rss"
